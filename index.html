  .stage { perspective: 1200px; width: 100%; max-width: 360px; }

    80% { transform: rotate(2deg); }
  }

const COLORS = ["오트밀", "차콜", "세이지", "크림", "네이비", "버건디", "올리브", "라이트 그레이"];
const TIMES  = ["오전 7시", "오전 9시", "점심 12시", "오후 3시", "저녁 6시", "저녁 8시", "밤 10시"];

/* ============================================
   동작 코드
   ============================================ */
const $ = (id) => document.getElementById(id);

const now = new Date();
const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
const todayLabel = `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. ${dayNames[now.getDay()]}요일`;
$("date").textContent = todayLabel;
$("shopBtn").href = SHOP_URL;
$("instaLink").href = INSTA_URL;


const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

let lastIndex = -1;

function makeFortune() {
  let i;
  // 다시 뽑을 때 직전과 같은 운세가 나오지 않게
  do { i = Math.floor(Math.random() * FORTUNES.length); } while (i === lastIndex && FORTUNES.length > 1);
  lastIndex = i;
  return {
    exercise: FORTUNES[i].ex,
    message: FORTUNES[i].text,
    color: pick(COLORS),
    time: pick(TIMES),
  };
}

let fortune = null;

// 글자가 칸을 넘치면 넘치지 않을 때까지 글자 크기를 줄임
function fitText(el, maxPx, minPx) {
  const box = el.parentElement;
  let size = maxPx;
  el.style.fontSize = size + "px";
  while (size > minPx && (el.scrollWidth > box.clientWidth || el.scrollHeight > box.clientHeight)) {
    size -= 0.5;
    el.style.fontSize = size + "px";
  }
}

function fitAll() {
  const w = $("card").clientWidth;           // 카드 폭에 비례해 기본 크기 결정
  fitText($("message"), w * 0.046, w * 0.03);
  fitText($("bannerText"), w * 0.036, w * 0.022);
  fitText($("exercise"), w * 0.05, w * 0.026);
}
window.addEventListener("resize", () => { if (fortune) fitAll(); });

// 문장 끝(. ! ? …)에서 나누기
function splitSentences(text) {
  return text.split(/(?<=[.!?…])\s+/).filter(Boolean);
}

function render(f) {
  $("exercise").textContent = "추천: " + f.exercise;
  const msg = $("message");
  msg.innerHTML = "";
  for (const sentence of splitSentences(f.message)) {
    const span = document.createElement("span");
    span.textContent = sentence;
    msg.appendChild(span);
  }
  fitAll();
  $("color").textContent = f.color;
  $("time").textContent = f.time;
}

function showResult(animate) {
  render(fortune);
  const card = $("card");
  if (animate) {
    card.classList.add("shake");
    setTimeout(() => { card.classList.remove("shake"); card.classList.add("flipped"); }, 600);
  } else {
    card.classList.add("flipped");
  }
  $("drawBtn").classList.add("hidden");
  ["shareHint", "shareBtn", "resetBtn", "shopBtn", "notice", "lucky"].forEach((id) => $(id).classList.remove("hidden"));
}

// 다시 뽑기: 카드를 뒤집어 처음 화면으로
function resetCard() {
  fortune = null;
  $("card").classList.remove("flipped");
  ["shareHint", "shareBtn", "resetBtn", "shopBtn", "notice", "lucky"].forEach((id) => $(id).classList.add("hidden"));
  $("drawBtn").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function draw() {
  if ($("card").classList.contains("flipped")) return;
  fortune = makeFortune();
  showResult(true);
}

$("card").addEventListener("click", draw);
$("drawBtn").addEventListener("click", draw);
$("resetBtn").addEventListener("click", resetCard);

/* ---------- 결과 카드 이미지 (인스타 스토리 1080×1920) ---------- */
function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// 한 문장이 길면 줄 길이가 비슷하도록 나눠서 줄바꿈
function wrapBalanced(ctx, text, maxWidth) {
  const total = ctx.measureText(text).width;
  if (total <= maxWidth) return [text];
  const n = Math.ceil(total / maxWidth);
  const lines = wrapText(ctx, text, Math.min(maxWidth, (total / n) * 1.15));
  return lines.length > n ? wrapText(ctx, text, maxWidth) : lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function makeCardImage() {
  await document.fonts.ready;
  const css = getComputedStyle(document.documentElement);
  const C = (name) => css.getPropertyValue(name).trim();
  const W = 1080, H = 1920;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const serif = '"Gowun Batang", serif';
  const sans = '"Noto Sans KR", sans-serif';

  ctx.fillStyle = C("--bg");
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  // 상단 로고 (투명 배경 PNG)
  const logo = await loadImage("assets/logo2_web.png");
  if (logo) {
    const lw = 280, lh = logo.height * (lw / logo.width);
    ctx.drawImage(logo, W / 2 - lw / 2, 50, lw, lh);
  }
  ctx.fillStyle = C("--ink");
  ctx.font = `700 70px ${serif}`;
  ctx.fillText("2027 신년운동운세", W / 2, 430);
  ctx.fillStyle = C("--purple");
  ctx.font = `400 34px ${serif}`;
  ctx.letterSpacing = "6px";
  ctx.fillText("Fitness Fortune", W / 2, 482);
  ctx.letterSpacing = "0px";
  ctx.fillStyle = C("--muted");
  ctx.font = `400 28px ${sans}`;
  ctx.fillText(todayLabel, W / 2, 528);

  // 카드 (card_front.jpg 위에 글자 얹기)
  const cw = 780, ch = 1040, cx = (W - cw) / 2, cy = 570;
  const cardImg = await loadImage("assets/card_front.jpg");
  ctx.save();
  roundRect(ctx, cx, cy, cw, ch, 38);
  ctx.clip();
  if (cardImg) ctx.drawImage(cardImg, cx, cy, cw, ch);
  ctx.restore();

  // 칸(%) 안에 글자를 맞춰 그리기
  const drawInZone = (text, zx, zy, zw, zh, color, weight, maxSize, minSize, multiLine) => {
    const bx = cx + cw * zx, by = cy + ch * zy, bw = cw * zw, bh = ch * zh;
    let size = maxSize, lines;
    while (true) {
      ctx.font = `${weight} ${size}px ${serif}`;
      lines = multiLine ? splitSentences(text).flatMap((t) => wrapBalanced(ctx, t, bw)) : [text];
      const tooWide = lines.some((l) => ctx.measureText(l).width > bw);
      if ((!tooWide && lines.length * size * 1.55 <= bh) || size <= minSize) break;
      size -= 1;
    }
    ctx.fillStyle = color;
    ctx.textBaseline = "middle";
    const lh = size * 1.55;
    let ty = by + bh / 2 - (lines.length - 1) * lh / 2;
    for (const l of lines) { ctx.fillText(l, cx + cw * (zx + zw / 2), ty); ty += lh; }
    ctx.textBaseline = "alphabetic";
  };
  drawInZone("2027 신년운동운세", .365, .07, .27, .04, C("--gold"), 700, 30, 16, false);
  drawInZone(fortune.message, .13, .32, .74, .36, C("--cream"), 400, 37, 22, true);
  drawInZone("추천: " + fortune.exercise, .262, .836, .476, .048, C("--gold"), 700, 39, 18, false);

  ctx.fillStyle = C("--muted");
  ctx.font = `400 32px ${sans}`;
  ctx.fillText(`행운의 색 · ${fortune.color}     행운의 시간 · ${fortune.time}`, W / 2, cy + ch + 65);

  // 하단
  ctx.fillStyle = C("--ink");
  ctx.font = `500 40px ${sans}`;
  ctx.fillText(INSTA_ID, W / 2, 1780);
  ctx.fillStyle = C("--muted");
  ctx.font = `400 30px ${sans}`;
  ctx.fillText("너의 2027 운동운세는?", W / 2, 1840);

  return new Promise((resolve) => cv.toBlob(resolve, "image/png"));
}

$("shareBtn").addEventListener("click", async () => {
  const btn = $("shareBtn");
  btn.disabled = true;
  btn.textContent = "카드 만드는 중…";
  try {
    const blob = await makeCardImage();
    const file = new File([blob], `운동운세_${todayKey}.png`, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "2027 신년운동운세" });
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
  } catch (e) {
    // 공유 창을 닫은 경우 등은 무시
  }
  btn.disabled = false;
  btn.textContent = "결과 카드 저장 · 공유";
});
